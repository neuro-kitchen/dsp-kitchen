# Checks pull requests. GitHub runners have no GPU, so tests run on the CubeCL CPU
# runtime only (DSPK_TEST_RUNTIMES=cpu; CUDA and wgpu are compiled in but not exercised). The full
# suite on wgpu and CUDA runs locally on a GPU machine before a release.
#
# The `changes` job reads which files changed and runs only the checks they can affect:
# documentation alone (Markdown, CITATION.cff, assets/, playground/, benchmarks/) runs nothing;
# the docs site (docs/) and the Python sources its API reference is generated from run the docs
# build. When the changes cannot be listed (a new branch, a force push), everything runs.
#
# How much runs depends on where the pull request goes, so one change is not built over and over:
# - into a versions/* branch (day-to-day work): the light run, `cargo check` of the workspace and
#   the docs build; no tests, no Python build;
# - into main (the release pull request), or started by hand (Actions > ci > Run workflow): the
#   full run;
# - draft pull requests: nothing, until they are marked ready.
# A push to main runs nothing here: the release pull request already ran the full checks, and the
# v* tag runs them once more inside release.yml before anything is published.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  DSPK_TEST_RUNTIMES: cpu

jobs:
  changes:
    name: What changed
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    outputs:
      # The full run: the release pull request (into main) or a run started by hand
      full: ${{ github.event_name == 'workflow_dispatch' || github.base_ref == 'main' }}
      rust: ${{ steps.classify.outputs.rust }}
      python: ${{ steps.classify.outputs.python }}
      docs: ${{ steps.classify.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: classify
        env:
          # Pull request: its base; a run started by hand has none (everything runs)
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            files=$(git diff --name-only "$BASE...$HEAD")
          else
            echo "changes cannot be listed: running everything"
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "python=true" >> "$GITHUB_OUTPUT"
            echo "docs=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$files"
          # Markdown anywhere and CITATION.cff are documentation; the rest by folder
          code=$(echo "$files" | grep -vE '\.md$|^CITATION\.cff$' || true)
          rust=false
          python=false
          if echo "$code" | grep -qE '^(crates|engine|serve|view|devices|synapse|hub|app|plugins)/|^bindings/python/dspk-py|^Cargo\.(toml|lock)$|^rust-toolchain|^\.github/workflows/ci\.yml$'; then
            rust=true
            python=true
          fi
          if echo "$code" | grep -qE '^bindings/python/|^pyproject\.toml$|^uv\.lock$'; then
            python=true
          fi
          # The site, and the Python sources and stubs its API reference is generated from
          docs=false
          if echo "$files" | grep -qE '^docs/|^bindings/python/python/|^playground/|^benchmarks/signal-operations/results/|^CHANGELOG\.md$|^\.github/workflows/ci\.yml$'; then
            docs=true
          fi
          echo "rust=$rust python=$python docs=$docs"
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "python=$python" >> "$GITHUB_OUTPUT"
          echo "docs=$docs" >> "$GITHUB_OUTPUT"

  rust:
    name: Rust (check; CPU-runtime tests in the full run)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      # ~/.local/share/tracel: the LLVM bundle the CPU runtime downloads at build time
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-directories: ~/.local/share/tracel
      # dspk-app's GUI stack (GPUI) builds against these system libraries on Linux
      - name: System libraries for dspk-app
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libfontconfig-dev libfreetype-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev
      # Every crate builds with wgpu + cuda + cpu by default (one feature set, so steps share builds)
      - name: Check the workspace
        run: cargo check --workspace --all-targets
      # The page's overview fold (JS) against the Rust fold's fixture (dspk-view checks the fixture)
      - name: Browser overview fold equals the engine's
        run: node --test engine/dspk-engine-web/tests/*.test.mjs
      - name: Unit tests of the host-side crates
        if: needs.changes.outputs.full == 'true'
        run: >
          cargo test -p dspk-core -p dspk-io -p dspk-hub -p dspk-view -p dspk-stream
          --lib
      - name: Neural-recording and sorting formats (dspk-synapse io)
        if: needs.changes.outputs.full == 'true'
        run: "cargo test -p dspk-synapse --lib io::"
      - name: Every dspk-ops operation against host references
        if: needs.changes.outputs.full == 'true'
        run: cargo test -p dspk-ops --test kernel_runtimes --test filter_runtimes
      - name: Device buffer writes
        if: needs.changes.outputs.full == 'true'
        run: cargo test -p dspk-ops --lib core::buffer
      - name: Pipeline engine (specs; stream and window runs against the whole recording)
        if: needs.changes.outputs.full == 'true'
        run: cargo test -p dspk-pipeline --test run

  python:
    name: Python (build, tests vs scipy, stubs)
    needs: changes
    if: needs.changes.outputs.python == 'true' && needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-directories: ~/.local/share/tracel
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Development environment
        run: uv sync
      - name: Build and install dspk
        working-directory: bindings/python
        run: uv run --project ../.. maturin develop --profile validate
      - name: Tests
        run: uv run python -m pytest bindings/python/tests -q
      # Every docstring example, as the API reference shows it (the CPU runtime: no GPU here)
      - name: Docstring examples
        working-directory: bindings/python
        env:
          DSPK_RUNTIME: cpu
        run: uv run --project ../.. python -m pytest -q --doctest-modules python/dspk

  docs:
    name: Docs (API reference current, site builds)
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Dependencies with bun (bun.lock); the build scripts run on Node
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      # The reference is generated from the sources (read statically, no build): regenerate it and
      # fail when the committed pages differ
      - name: Python API reference and Course are up to date
        run: |
          uv run --no-project --with griffe==2.4.1 python -I docs/scripts/python_api.py
          python3 docs/scripts/course.py
          python3 docs/scripts/benchmarks.py
          python3 docs/scripts/rust_snippets.py
          git status --porcelain docs/src/content/docs crates/dspk/tests
          test -z "$(git status --porcelain docs/src/content/docs crates/dspk/tests)" || {
            echo "the Python API reference is out of date: run docs/scripts/python_api.py and commit"; git diff --stat; exit 1; }
      - name: Install
        working-directory: docs
        run: bun install --frozen-lockfile
      - name: Build the site
        working-directory: docs
        run: bun run build
