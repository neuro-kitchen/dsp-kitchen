# Checks every push and pull request. GitHub runners have no GPU, so tests run on the CubeCL CPU
# runtime only (DSPK_TEST_RUNTIMES=cpu; CUDA and wgpu are compiled in but not exercised). The full
# suite on wgpu and CUDA runs locally on a GPU machine before a release.
#
# The `changes` job reads which files changed and runs only the checks they can affect:
# documentation alone (Markdown, CITATION.cff, assets/, playground/, benchmarks/) runs nothing;
# the docs site (docs/) and the Python sources its API reference is generated from run the docs
# build. When the changes cannot be listed (a new branch, a force push), everything runs.
name: ci

on:
  # Pull requests cover the versions/* branches; pushes to main check what was merged
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  DSPK_TEST_RUNTIMES: cpu

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.classify.outputs.rust }}
      python: ${{ steps.classify.outputs.python }}
      docs: ${{ steps.classify.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: classify
        env:
          # Pull request: its base; push: the commit before it
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            files=$(git diff --name-only "$BASE...$HEAD")
          else
            echo "changes cannot be listed: running everything"
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "python=true" >> "$GITHUB_OUTPUT"
            echo "docs=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$files"
          # Markdown anywhere and CITATION.cff are documentation; the rest by folder
          code=$(echo "$files" | grep -vE '\.md$|^CITATION\.cff$' || true)
          rust=false
          python=false
          if echo "$code" | grep -qE '^(crates|engine|serve|synapse|hub|app|plugins)/|^bindings/python/dspk-py|^Cargo\.(toml|lock)$|^rust-toolchain|^\.github/workflows/ci\.yml$'; then
            rust=true
            python=true
          fi
          if echo "$code" | grep -qE '^bindings/python/|^pyproject\.toml$|^uv\.lock$'; then
            python=true
          fi
          # The site, and the Python sources and stubs its API reference is generated from
          docs=false
          if echo "$files" | grep -qE '^docs/|^bindings/python/python/|^\.github/workflows/ci\.yml$'; then
            docs=true
          fi
          echo "rust=$rust python=$python docs=$docs"
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "python=$python" >> "$GITHUB_OUTPUT"
          echo "docs=$docs" >> "$GITHUB_OUTPUT"

  rust:
    name: Rust (check, CPU-runtime tests)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      # ~/.local/share/tracel: the LLVM bundle the CPU runtime downloads at build time
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-directories: ~/.local/share/tracel
      # dspk-app's GUI stack (GPUI) builds against these system libraries on Linux
      - name: System libraries for dspk-app
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libfontconfig-dev libfreetype-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev
      # Every crate builds with wgpu + cuda + cpu by default (one feature set, so steps share builds)
      - name: Check the workspace
        run: cargo check --workspace --all-targets
      - name: Unit tests of the host-side crates
        run: >
          cargo test -p dspk-core -p dspk-io -p dspk-hub -p dspk-view -p dspk-stream
          --lib
      - name: Neural-recording and sorting formats (dspk-synapse io)
        run: "cargo test -p dspk-synapse --lib io::"
      - name: Every dspk-ops operation against host references
        run: cargo test -p dspk-ops --test kernel_runtimes --test filter_runtimes
      - name: Device buffer writes
        run: cargo test -p dspk-ops --lib core::buffer
      - name: Pipeline engine (specs; stream and window runs against the whole recording)
        run: cargo test -p dspk-pipeline --test run

  python:
    name: Python (build, tests vs scipy, stubs)
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-directories: ~/.local/share/tracel
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Development environment
        run: uv sync
      - name: Build and install dspk
        working-directory: bindings/python
        run: uv run --project ../.. maturin develop --profile validate
      - name: Tests
        run: uv run python -m pytest bindings/python/tests -q
      # Every docstring example, as the API reference shows it (the CPU runtime: no GPU here)
      - name: Docstring examples
        working-directory: bindings/python
        env:
          DSPK_RUNTIME: cpu
        run: uv run --project ../.. python -m pytest -q --doctest-modules python/dspk

  docs:
    name: Docs (API reference current, site builds)
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      # The reference is generated from the sources (read statically, no build): regenerate it and
      # fail when the committed pages differ
      - name: Python API reference is up to date
        run: |
          uv run --no-project --with griffe==2.4.1 python -I docs/scripts/python_api.py
          git status --porcelain docs/src/content/docs
          test -z "$(git status --porcelain docs/src/content/docs)" || {
            echo "the Python API reference is out of date: run docs/scripts/python_api.py and commit"; git diff --stat; exit 1; }
      - name: Install
        working-directory: docs
        run: npm ci --no-audit --no-fund
      - name: Build the site
        working-directory: docs
        run: npm run build
