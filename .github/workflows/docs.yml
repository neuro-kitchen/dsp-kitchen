# Builds the mdBook in docs/book and publishes it to https://neuro-kitchen.github.io/dsp-kitchen/.
# Prerequisite (one-time repo setting):
#   https://github.com/neuro-kitchen/dsp-kitchen/settings/pages
#   -> Build and deployment -> Source: "GitHub Actions"
# Pull requests only build (catches broken links/SUMMARY); pushes to main also deploy.
name: docs

on:
  push:
    branches: [main]
    paths: ["docs/book/**", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/book/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MDBOOK_VERSION: "0.5.2"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install mdBook
        run: |
          url="https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          mkdir -p "$HOME/.local/bin"
          curl -sSL "$url" | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        id: pages
        uses: actions/configure-pages@v6

      # book.toml sets build-dir = "../../target/book"
      - name: Build book
        run: mdbook build docs/book

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: target/book

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
