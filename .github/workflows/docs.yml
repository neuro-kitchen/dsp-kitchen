# Builds the documentation site (docs/, Starlight) and deploys it to GitHub Pages:
# https://neuro-kitchen.github.io/dsp-kitchen/, with the app for the browser at /dsp-kitchen/web/
# (app/dspk-app-web/build.sh: the app and its engine worker; nightly Rust, pinned in build.sh).
# Runs on pushes to main that change the site or the web app, or by hand. The `github-pages`
# environment only accepts main. CI (ci.yml) checks the same build on pull requests, and that the
# generated Python API reference is current.
name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "CHANGELOG.md"
      - "playground/*/figures/**"
      - "benchmarks/signal-operations/results/**"
      - "assets/img/**"
      - "app/dspk-app-web/**"
      - "engine/dspk-engine-web/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# Least privilege: read the code, write only to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  app:
    name: Build the app for the browser
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tools (nightly, wasm-bindgen of Cargo.lock's version, binaryen, brotli)
        run: |
          toolchain=$(sed -n 's/^TOOLCHAIN="${DSPK_WEB_TOOLCHAIN:-\(nightly-[0-9-]*\)}"$/\1/p' app/dspk-app-web/build.sh)
          rustup toolchain install "$toolchain" --profile minimal --component rust-src --target wasm32-unknown-unknown
          bindgen=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/version = |"/, ""); print; exit }' Cargo.lock)
          cargo install wasm-bindgen-cli --version "$bindgen" --locked
          sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends binaryen brotli
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: web-app
      - name: Build
        run: app/dspk-app-web/build.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-app
          path: app/dspk-app-web/dist
          if-no-files-found: error

  build:
    name: Build the site
    needs: app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Dependencies with bun (bun.lock); the build scripts run on Node
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install
        working-directory: docs
        run: bun install --frozen-lockfile
      - name: Build
        working-directory: docs
        run: bun run build
      # The app at /dsp-kitchen/web/ (Pages serves no Brotli files: the plain ones are enough)
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-app
          path: docs/dist/web
      - name: Leave out the compressed copies
        run: find docs/dist/web -name '*.br' -delete
      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
