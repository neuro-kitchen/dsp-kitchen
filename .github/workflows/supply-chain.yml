# Supply-chain checks with cargo-deny (deny.toml): no dependency with a known vulnerability
# (RustSec), none yanked, only allowed licences, crates.io as the only source. Runs on every pull
# request and push to main, and weekly: new advisories appear without any change here.
name: supply-chain

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-deny:
    name: cargo-deny (${{ matrix.checks }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Advisories apart, so a new advisory does not hide licence or source results
        checks: [advisories, bans licenses sources]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check ${{ matrix.checks }}
