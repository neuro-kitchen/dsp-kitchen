# Supply-chain checks with cargo-deny (deny.toml): no dependency with a known vulnerability
# (RustSec), none yanked, only allowed licences, crates.io as the only source. Runs on pull
# requests that change the dependencies or the rules, and weekly: new advisories appear without
# any change here. The v* tag runs it again inside release.yml.
name: supply-chain

on:
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - ".github/workflows/supply-chain.yml"
  schedule:
    # Mondays 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-deny:
    name: cargo-deny (${{ matrix.checks }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Advisories apart, so a new advisory does not hide licence or source results
        checks: [advisories, bans licenses sources]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check ${{ matrix.checks }}
