# Release on a version tag (v0.0.2, ...): build and check everything, then publish to crates.io and
# PyPI through trusted publishing (no stored tokens). The publish jobs run in the GitHub
# environments `crates-io` and `pypi`, which only accept `v*` tags and wait for a required
# reviewer's approval; the registries only accept tokens from these jobs.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check version and package crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-directories: ~/.local/share/tracel
      - name: Tag matches the workspace version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "dspk") | .version')
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != workspace version ${version}"; exit 1; }
      - name: Package and verify the publishable crates
        run: cargo publish --dry-run --workspace

  wheels:
    name: Wheel (${{ matrix.os }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
            features: extension-module,wgpu,cuda,cpu
          - os: windows-latest
            target: x64
            features: extension-module,wgpu,cuda,cpu
          # No CUDA on macOS
          - os: macos-latest
            target: aarch64
            features: extension-module,wgpu,cpu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: bindings/python
          target: ${{ matrix.target }}
          # 2_34: CubeCL's CPU runtime downloads a prebuilt LLVM that needs glibc >= 2.34 (2_28 fails
          # with "GLIBC_2.33 not found"); the wheel runs on Ubuntu 22.04+, Debian 12+, RHEL 9+
          manylinux: "2_34"
          # --strip: symbols off (≈ 188 → 139 MiB extension, wheel ≈ 47 MiB with the CPU runtime's LLVM)
          args: --release --strip --out dist --no-default-features --features ${{ matrix.features }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.os }}
          path: bindings/python/dist

  sdist:
    name: Source distribution
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: bindings/python
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: bindings/python/dist

  publish-crates:
    name: Publish to crates.io
    needs: [check, wheels, sdist]
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write # exchanged for a short-lived crates.io token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-directories: ~/.local/share/tracel
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      # Dependency order; publish = false crates are skipped. Crates already on crates.io at this
      # version are left out, so "Re-run failed jobs" finishes a partial publish (cargo stops on
      # the first crate that exists: v0.0.3 published three of six, then a re-run could not
      # continue). Every published crate needs a trusted publisher on crates.io (this repository,
      # workflow release.yml, environment crates-io), or its upload is refused with 403.
      - name: Publish the crates not yet on crates.io
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "dspk") | .version')
          skip=()
          left=0
          for crate in $(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.publish != []) | .name'); do
            if curl -sf -A "dspk-release (github.com/neuro-kitchen/dsp-kitchen)" "https://crates.io/api/v1/crates/$crate/$version" > /dev/null; then
              echo "$crate $version is already on crates.io: skipped"
              skip+=(--exclude "$crate")
            else
              left=$((left + 1))
            fi
          done
          if [ "$left" -eq 0 ]; then
            echo "every crate is already published at $version"
            exit 0
          fi
          cargo publish --workspace "${skip[@]}"
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  publish-pypi:
    name: Publish to PyPI
    needs: [check, wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
