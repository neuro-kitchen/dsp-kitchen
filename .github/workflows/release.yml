# Release on a version tag (v0.0.2, ...): build and check everything, then publish to crates.io and
# PyPI through trusted publishing (no stored tokens). The publish jobs run in the GitHub
# environments `crates-io` and `pypi`, which only accept `v*` tags and wait for a required
# reviewer's approval; the registries only accept tokens from these jobs. After both, the GitHub
# release of the tag gets the dspk-cli-sorter builds and their manifest (`dspk sorters install`).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check version and package crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-directories: ~/.local/share/tracel
      # The app crates (GPUI) build against these system libraries on Linux; packaging verifies them
      - name: System libraries for dspk-app
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libfontconfig-dev libfreetype-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev
      - name: Tag matches the workspace version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "dspk") | .version')
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != workspace version ${version}"; exit 1; }
      - name: dspk's extras pin this version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "dspk") | .version')
          wrong=$(grep -oE '"dspk-(synapse|app)==[^"]+"' bindings/python/pyproject.toml | grep -v "==${version}\"" || true)
          test -z "$wrong" || { echo "bindings/python/pyproject.toml pins $wrong, the workspace is ${version}"; exit 1; }
      - name: Package and verify the publishable crates
        run: cargo publish --dry-run --workspace
      # Nothing is published with a known vulnerability, a yanked crate or a licence not allowed
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  wheels:
    name: Wheel (${{ matrix.os }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # `dspk` is the core; `dspk-synapse` is the same extension built with Synapse in
          # HIP (AMD): Linux only in cubecl-hip; compiled in, not run (no AMD GPU to test on)
          - { os: ubuntu-latest, target: x86_64, project: bindings/python, wheel: dspk, features: "extension-module,wgpu,cuda,hip,cpu" }
          - { os: ubuntu-latest, target: x86_64, project: bindings/python/wheels/dspk-synapse, wheel: dspk-synapse, features: "extension-module,synapse,wgpu,cuda,hip,cpu" }
          - { os: windows-latest, target: x64, project: bindings/python, wheel: dspk, features: "extension-module,wgpu,cuda,cpu" }
          - { os: windows-latest, target: x64, project: bindings/python/wheels/dspk-synapse, wheel: dspk-synapse, features: "extension-module,synapse,wgpu,cuda,cpu" }
          # No CUDA on macOS
          - { os: macos-latest, target: aarch64, project: bindings/python, wheel: dspk, features: "extension-module,wgpu,cpu" }
          - { os: macos-latest, target: aarch64, project: bindings/python/wheels/dspk-synapse, wheel: dspk-synapse, features: "extension-module,synapse,wgpu,cpu" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: ${{ matrix.project }}
          target: ${{ matrix.target }}
          # 2_34: CubeCL's CPU runtime downloads a prebuilt LLVM that needs glibc >= 2.34 (2_28 fails
          # with "GLIBC_2.33 not found"); the wheel runs on Ubuntu 22.04+, Debian 12+, RHEL 9+
          manylinux: "2_34"
          # --strip: symbols off (≈ 188 → 139 MiB extension, wheel ≈ 47 MiB with the CPU runtime's LLVM)
          args: --release --strip --out dist --no-default-features --features ${{ matrix.features }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.wheel }}-${{ matrix.os }}
          path: ${{ matrix.project }}/dist

  # The desktop app as a wheel (`dspk[app]`). Its own job: a failure here leaves that platform
  # without `dspk[app]` and doesn't hold up the rest of the release.
  app-wheels:
    name: App wheel (${{ matrix.os }})
    needs: check
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc 2.35: Ubuntu 22.04+, Debian 12+. The system's GUI libraries aren't bundled
          - { os: ubuntu-22.04, target: x86_64, features: "wgpu,cuda,cpu,synapse", manylinux: "2_35", args: "--auditwheel skip" }
          - { os: windows-latest, target: x64, features: "wgpu,cuda,cpu,synapse", manylinux: "off", args: "" }
          - { os: macos-latest, target: aarch64, features: "wgpu,cpu,synapse", manylinux: "off", args: "" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: System libraries for dspk-app
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libfontconfig-dev libfreetype-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: bindings/python/wheels/dspk-app
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          # On the runner itself: the GUI's system libraries are installed there, not in a container
          container: "off"
          args: --release --strip --out dist --no-default-features --features ${{ matrix.features }} ${{ matrix.args }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-dspk-app-${{ matrix.os }}
          path: bindings/python/wheels/dspk-app/dist

  sdist:
    name: Source distribution
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: bindings/python
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: bindings/python/dist

  # Every sorter in one GPL-3.0 program, run by `dspk sort` as a separate process; released as files
  # of the GitHub release (not on crates.io / PyPI), installed by `dspk sorters install`
  sorters:
    name: dspk-cli-sorter (${{ matrix.target }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc 2.35 (Ubuntu 22.04+, Debian 12+); the CPU runtime's prebuilt LLVM needs >= 2.34
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            features: wgpu,cuda,hip,cpu,hub
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            features: wgpu,cuda,cpu,hub
          # No CUDA on macOS
          - os: macos-latest
            target: aarch64-apple-darwin
            features: wgpu,cpu,hub
    env:
      CARGO_PROFILE_RELEASE_STRIP: symbols
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: sorters-${{ matrix.target }}
          cache-directories: ~/.local/share/tracel
      - name: Build
        run: cargo build --release --locked -p dspk-cli-sorter --no-default-features --features ${{ matrix.features }}
      - name: Name the file after its target
        shell: bash
        run: |
          ext=""
          if [ "${{ runner.os }}" = "Windows" ]; then ext=".exe"; fi
          mkdir -p out
          cp "target/release/dspk-cli-sorter${ext}" "out/dspk-cli-sorter-${{ matrix.target }}${ext}"
          "out/dspk-cli-sorter-${{ matrix.target }}${ext}" --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sorters-${{ matrix.target }}
          path: out
      # The container image (job `image`) takes its two programs from this run: the sorter built
      # above and the `dspk` command line, built here on the same dependencies (Ubuntu 22.04's
      # glibc 2.35 runs on the image's Debian 12)
      - name: Build dspk for the container image
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          cargo build --release --locked -p dspk-cli --no-default-features --features wgpu,cuda,cpu,hub
          mkdir -p image
          cp target/release/dspk target/release/dspk-cli-sorter image/
          image/dspk --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        with:
          name: image-binaries
          path: image

  publish-crates:
    name: Publish to crates.io
    needs: [check, wheels, sdist]
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write # exchanged for a short-lived crates.io token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-directories: ~/.local/share/tracel
      # The app crates (GPUI) build against these system libraries on Linux; packaging verifies them
      - name: System libraries for dspk-app
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libfontconfig-dev libfreetype-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      # Dependency order; publish = false crates are skipped. Crates already on crates.io at this
      # version are left out, so "Re-run failed jobs" finishes a partial publish (cargo stops on
      # the first crate that exists: v0.0.3 published three of six, then a re-run could not
      # continue). Every published crate needs a trusted publisher on crates.io (this repository,
      # workflow release.yml, environment crates-io), or its upload is refused with 403. A crate
      # new to crates.io cannot be created by trusted publishing: it is skipped here, published
      # once by hand from the tag (`cargo publish -p <crate>`, a short-lived publish-new token),
      # then given its trusted publisher.
      - name: Publish the crates not yet on crates.io
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "dspk") | .version')
          skip=()
          left=0
          new=()
          agent="dspk-release (github.com/neuro-kitchen/dsp-kitchen)"
          for crate in $(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.publish != []) | .name'); do
            if curl -sf -A "$agent" "https://crates.io/api/v1/crates/$crate/$version" > /dev/null; then
              echo "$crate $version is already on crates.io: skipped"
              skip+=(--exclude "$crate")
            elif ! curl -sf -A "$agent" "https://crates.io/api/v1/crates/$crate" > /dev/null; then
              echo "::warning::$crate is new to crates.io: publish it once by hand from this tag, then add its trusted publisher"
              skip+=(--exclude "$crate")
              new+=("$crate")
            else
              left=$((left + 1))
            fi
          done
          if [ "$left" -eq 0 ]; then
            echo "every crate is already published at $version (new, to publish by hand: ${new[*]:-none})"
            exit 0
          fi
          cargo publish --workspace "${skip[@]}"
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  publish-pypi:
    name: Publish to PyPI
    needs: [check, wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # trusted publishing
    steps:
      # Wheels and the sdist only (the sorters' builds are artifacts too, for the GitHub release)
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # dspk and dspk-synapse; dspk-app publishes from its own job below
          pattern: wheel-dspk-[!a]*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  # Its own job and environment: PyPI lets one workflow + environment be the pending publisher of
  # only one new project, and a failure here shouldn't hold up the rest of the release.
  publish-pypi-app:
    name: Publish dspk-app to PyPI
    needs: [check, app-wheels]
    runs-on: ubuntu-latest
    continue-on-error: true
    environment: pypi-app
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheel-dspk-app-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    name: GitHub release (dspk-cli-sorter)
    needs: [sorters, publish-crates, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and attach files
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sorters-*
          path: out
          merge-multiple: true
      # `dspk sorters install` reads this: per target, the file, its SHA-256 and size
      - name: Write the manifest
        run: |
          python3 - "${GITHUB_REF_NAME#v}" <<'PY'
          import hashlib, json, os, sys
          version, assets = sys.argv[1], {}
          for name in sorted(os.listdir("out")):
              path = os.path.join("out", name)
              target = name.removeprefix("dspk-cli-sorter-").removesuffix(".exe")
              digest = hashlib.sha256(open(path, "rb").read()).hexdigest()
              assets[target] = {"file": name, "sha256": digest, "size": os.path.getsize(path)}
          json.dump({"version": version, "assets": assets}, open("out/dspk-cli-sorter-manifest.json", "w"), indent=2)
          print(json.dumps(assets, indent=2))
          PY
      # CHANGELOG.md is the one source: this version's section becomes the release notes
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" 'index($0, "## " v " ") == 1 { f = 1; next } /^## / { f = 0 } f' CHANGELOG.md > release-notes.md
          test -s release-notes.md || { echo "CHANGELOG.md has no section for ${GITHUB_REF_NAME#v}"; exit 1; }
          cat >> release-notes.md <<'NOTES'

          ## Install

          Crates are on crates.io, and `pip install dspk` gets the Python package. The files below are `dspk-cli-sorter` (every spike sorter, GPL-3.0 as a whole; source: this tag), installed by `dspk sorters install`.
          NOTES
      - name: Create the release and attach the files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --verify-tag --notes-file release-notes.md
          gh release upload "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --clobber

  # The web app (app/dspk-app-web/dist: the loader and the threaded build) for the image. Nightly
  # Rust, pinned in build.sh (gpui's web platform needs it, and threads need -Z build-std)
  web:
    name: Web app (threaded build)
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tools (nightly, wasm-bindgen of Cargo.lock's version, binaryen, brotli, clang for zarrs' C codecs)
        run: |
          toolchain=$(sed -n 's/^TOOLCHAIN="${DSPK_WEB_TOOLCHAIN:-\(nightly-[0-9-]*\)}"$/\1/p' app/dspk-app-web/build.sh)
          rustup toolchain install "$toolchain" --profile minimal --component rust-src --target wasm32-unknown-unknown
          bindgen=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/version = |"/, ""); print; exit }' Cargo.lock)
          cargo install wasm-bindgen-cli --version "$bindgen" --locked
          sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends brotli clang llvm
          # binaryen from its release, pinned: Ubuntu's package is too old for the module's
          # features (bulk memory, threads: "invalid code after misc prefix")
          curl -sSfL -o /tmp/binaryen.tgz https://github.com/WebAssembly/binaryen/releases/download/version_130/binaryen-version_130-x86_64-linux.tar.gz
          echo "0a18362361ad05465118cd8eeb72edaeec89de6894bc283576ef4e07aa3babcc  /tmp/binaryen.tgz" | sha256sum -c -
          tar -xzf /tmp/binaryen.tgz -C /tmp && echo /tmp/binaryen-version_130/bin >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: web-mt
      - name: Build
        run: app/dspk-app-web/build.sh mt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-app
          path: app/dspk-app-web/dist
          if-no-files-found: error

  # The container image on GitHub's registry: ghcr.io/neuro-kitchen/dspk:<version> and :latest.
  # Target `gpu` of deploy/Containerfile (the dspk command line, the server and every sorter; wgpu
  # on any vendor's GPU, or the CPU; no NVIDIA software inside), from the programs this run built,
  # so nothing is compiled twice. Pushed last, after the release exists. The package inherits
  # nothing from the repository: make it public once in the organization's package settings.
  image:
    name: Container image (ghcr.io)
    needs: [sorters, web, github-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io/neuro-kitchen/dspk
    env:
      IMAGE: ghcr.io/neuro-kitchen/dspk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-binaries
          path: deploy/prebuilt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-app
          path: app/dspk-app-web/dist
      - name: Build
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Artifacts lose their mode bits
          chmod 0755 deploy/prebuilt/dspk deploy/prebuilt/dspk-cli-sorter
          podman build -f deploy/Containerfile --ignorefile deploy/.containerignore \
            --build-arg BINARIES=prebuilt --target gpu \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${version}" \
            --label "org.opencontainers.image.description=dspk: GPU signal processing and spike sorting (command line, server, sorters)" \
            --label "org.opencontainers.image.licenses=GPL-3.0-only AND (MIT OR Apache-2.0)" \
            -t "${IMAGE}:${version}" -t "${IMAGE}:latest" .
      # The image must run before it is published: the version it reports is the tag's, and the
      # sorter program starts. No GPU on the runner: the CPU runtime answers.
      - name: Check the image
        run: |
          version="${GITHUB_REF_NAME#v}"
          podman run --rm "${IMAGE}:${version}" --version | tee /dev/stderr | grep -qF "${version}"
          podman run --rm --entrypoint dspk-cli-sorter "${IMAGE}:${version}" --version
          podman run --rm -e DSPK_RUNTIME=cpu "${IMAGE}:${version}" doctor
      - name: Push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "${GITHUB_TOKEN}" | podman login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          podman push "${IMAGE}:${version}"
          podman push "${IMAGE}:latest"
