// dspk-stream session protocol, version 2.
//
// One QUIC connection (ALPN "dspk-stream/2") per client, authenticated by its certificate (see
// the crate's `auth`). Every message is a 4-byte big-endian length followed by the protobuf
// encoding; receivers reject lengths above their limit before allocating.
//
// Streams:
//   control  bidirectional, opened by the client: ClientHello → ServerInfo, then Subscribe.
//   signal   unidirectional, opened by the server after Subscribe: SignalFrame, ….
//   request  bidirectional, one per request, opened by the client: Request → Response.
// Requests (views, files, …) travel on their own streams so they never wait behind signal data.
//
// A server serves files under one data root: paths are relative to it, and anything outside it,
// hidden (a component starting with '.') or reached through a link out of it is refused. Each
// client opens its own recording (Open); views and the signal are of that recording.

syntax = "proto3";

package dspk_stream.v1;

// An exact fraction (sample rates in Hz, times in seconds).
message Ratio {
  uint64 numerator = 1;
  uint64 denominator = 2;
}

// Numeric type of stored samples (little-endian).
enum SampleFormat {
  SAMPLE_FORMAT_UNSPECIFIED = 0;
  SAMPLE_FORMAT_I8 = 1;
  SAMPLE_FORMAT_I16 = 2;
  SAMPLE_FORMAT_U16 = 3;
  SAMPLE_FORMAT_I32 = 4;
  SAMPLE_FORMAT_F32 = 5;
  SAMPLE_FORMAT_F64 = 6;
}

enum Unit {
  UNIT_UNSPECIFIED = 0;
  UNIT_VOLT = 1;
  UNIT_MILLIVOLT = 2;
  UNIT_MICROVOLT = 3;
  UNIT_AMPERE = 4;
  UNIT_MILLIAMPERE = 5;
  UNIT_MICROAMPERE = 6;
  UNIT_DIMENSIONLESS = 7;
  // Any other unit, by its symbol in Channel.unit_symbol.
  UNIT_OTHER = 8;
}

// One channel: value = stored · gain + offset, in unit.
message Channel {
  string name = 1;
  float gain = 2;
  float offset = 3;
  Unit unit = 4;
  string unit_symbol = 5;
}

// client → server, first message on the control stream.
message ClientHello {
  uint32 protocol_version = 1;
}

// What a client may do (from its enrollment).
enum Permission {
  PERMISSION_UNSPECIFIED = 0;
  // Recordings, views, files.
  PERMISSION_READ = 1;
  // Also configure, start and stop jobs.
  PERMISSION_CONTROL = 2;
}

// What the server is doing.
enum DeviceState {
  DEVICE_STATE_UNSPECIFIED = 0;
  // Idle: a job can be configured and started.
  DEVICE_STATE_STOPPED = 1;
  DEVICE_STATE_RUNNING = 2;
  // The last job failed (Status says why); configure again to clear it.
  DEVICE_STATE_ERROR = 3;
}

// server → client, the answer to ClientHello.
message ServerInfo {
  uint32 protocol_version = 1;
  // The server's name (its host) and the dspk version it runs.
  string server_name = 2;
  string server_version = 3;
  // Who this client is to the server, and what it may do.
  string peer_name = 4;
  Permission permission = 5;
  DeviceState state = 6;
  // Whether the server has a data root (files can be listed and opened).
  bool has_files = 7;
  // The recording the server opened for every client at start, if any.
  Header recording = 8;
}

// What a recording is: the answer to Open, and part of ServerInfo.
message Header {
  uint32 protocol_version = 1;
  string name = 2;
  repeated Channel channels = 3;
  Ratio sample_rate_hz = 4;
  SampleFormat format = 5;
  // Samples per channel; 0 for a live source of unknown length.
  uint64 samples = 6;
  // Time of sample 0 from the acquisition start.
  Ratio start_time_s = 7;
  map<string, string> metadata = 8;
}

// client → server on the control stream: start the signal stream at sample first_sample.
message Subscribe {
  uint64 first_sample = 1;
}

// server → client on the signal stream: samples first_sample .. first_sample + samples of
// every channel, channel-major, stored as Header.format.
message SignalFrame {
  uint64 sequence = 1;
  uint64 first_sample = 2;
  uint32 samples = 3;
  bytes data = 4;
  // Server clock when sent (Unix nanoseconds), for latency measurements.
  uint64 sent_unix_ns = 5;
}

// List a directory under the data root ("" is the root itself).
message ListFiles {
  string dir = 1;
}

enum FileKind {
  FILE_KIND_UNSPECIFIED = 0;
  FILE_KIND_DIRECTORY = 1;
  // A file or store dspk can open as a recording.
  FILE_KIND_RECORDING = 2;
  // A sorting (.sorting.zarr).
  FILE_KIND_SORTING = 3;
  FILE_KIND_OTHER = 4;
}

message FileEntry {
  string name = 1;
  FileKind kind = 2;
  // Bytes (files; 0 for directories).
  uint64 size = 3;
  uint64 modified_unix = 4;
}

message FileList {
  // The directory listed, relative to the data root.
  string dir = 1;
  repeated FileEntry entries = 2;
}

// Open a recording under the data root for this client (its views and signal).
message Open {
  string path = 1;
  // The source within the file ("" = its default one).
  string source = 2;
}

// client → server, the only message on a request stream.
message Request {
  oneof kind {
    ViewRequest view = 1;
    ListFiles list_files = 2;
    Open open = 3;
  }
}

// server → client, the answer on a request stream.
message Response {
  oneof kind {
    EnvelopeFrame envelope = 1;
    FileList files = 2;
    // The recording just opened.
    Header header = 3;
    // The request was refused or failed.
    string error = 4;
  }
}

// A view of the open recording: [min, max] columns or samples of some channels.
message ViewRequest {
  repeated uint32 channels = 1;
  uint64 start = 2;
  uint64 end = 3;
  uint32 width = 4;
}

// [min, max] per column, row per requested channel: min_max[2 · (row · width + column)] is the
// min and the next value the max. NaN where nothing is known yet or every sample is NaN.
message Columns {
  repeated float min_max = 1;
  // False while some columns wait for the server's pyramid: ask again later.
  bool complete = 2;
}

// The samples themselves (fewer samples than columns), row per requested channel.
message Samples {
  repeated float values = 1;
}

// A view's contents (in Response.envelope).
message EnvelopeFrame {
  oneof content {
    Columns columns = 1;
    Samples samples = 2;
    // The request could not be served (e.g. out of range).
    string error = 3;
  }
}
