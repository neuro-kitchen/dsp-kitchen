[package]
name = "dspk-py"
description = "The `dspk` Python extension: one native module that registers every binding crate"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[lib]
name = "_native"
# rlib as well: the `stub_gen` binary links it
crate-type = ["cdylib", "rlib"]

[features]
# wgpu, cuda and cpu, and hip on Linux in the release wheels (compiled, not run: no AMD GPU to test on)
default = ["wgpu", "cuda", "cpu", "synapse"]
# Electrophysiology: the `dspk-synapse` wheel is this extension built with it; the `dspk` wheel without
synapse = ["dep:dspk-py-synapse"]
# Set by maturin when it builds the wheel; off for `cargo` builds of the workspace (linker)
extension-module = ["pyo3/extension-module"]
wgpu = ["dspk-py-core/wgpu", "dspk-py-synapse?/wgpu"]
cpu = ["dspk-py-core/cpu", "dspk-py-synapse?/cpu"]
cuda = ["dspk-py-core/cuda", "dspk-py-synapse?/cuda"]
hip = ["dspk-py-core/hip", "dspk-py-synapse?/hip"]

[dependencies]
dspk-py-core.workspace = true
dspk-py-synapse = { workspace = true, optional = true }
# abi3: one wheel per platform serves every CPython >= 3.10
pyo3 = { workspace = true, features = ["abi3-py310"] }
pyo3-stub-gen.workspace = true
