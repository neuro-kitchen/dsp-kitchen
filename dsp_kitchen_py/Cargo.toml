[package]
name = "dsp_kitchen_py"
description = "The dsp-kitchen Python SDK & PyO3 native bindings"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[lib]
name = "dsp_kitchen_bindings"
crate-type = ["cdylib", "rlib"]

[features]
default = ["wgpu", "hub"]
## Enable `pyo3/extension-module` when building the Python wheel via Maturin,
## while keeping it off during `cargo test --workspace` to avoid linker errors.
extension-module = ["pyo3/extension-module"]
## CubeCL runtimes (chosen at run time with `dsp_kitchen.runtime.set`)
wgpu = ["dsp-core/wgpu", "dsp-base/wgpu"]
cpu = ["dsp-core/cpu", "dsp-base/cpu", "dsp-synapse/cpu"]
cuda = ["dsp-core/cuda", "dsp-base/cuda", "dsp-synapse/cuda"]
hip = ["dsp-core/hip", "dsp-base/hip", "dsp-synapse/hip"]
## `ModelHub` and `UniversalTemplates.from_hub`: verified downloads (network access)
hub = ["dsp-synapse-ml/hub"]

[dependencies]
dsp-core = { workspace = true, features = ["compute"] }
dsp-base.workspace = true
dsp-io = { workspace = true, features = ["neuro"] }
dsp-synapse.workspace = true
# Sorters and the catalog only (no Burn backends)
dsp-synapse-ml = { workspace = true, default-features = false }
cubecl.workspace = true
pyo3.workspace = true
numpy.workspace = true
# Generates the `.pyi` stubs (binary `stub_gen`): types, defaults and docstrings for editors and docs
pyo3-stub-gen = "0.23.1"
