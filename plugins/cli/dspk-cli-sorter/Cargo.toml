[package]
name = "dspk-cli-sorter"
description = "Every spike sorter of dspk in one program: Kilosort4, EMUsort, MountainSort 5, SpyKING CIRCUS 2, Tridesclous 2"
version.workspace = true
edition.workspace = true
authors.workspace = true
# Contains Kilosort4 and EMUsort (GPL-3.0): the program is GPL-3.0 as a whole. dspk runs it as a
# separate program and never links it. Released as files of each GitHub release, not on crates.io.
license = "GPL-3.0-only"
publish = false

[[bin]]
name = "dspk-cli-sorter"
path = "src/main.rs"

[features]
default = ["wgpu", "cuda", "cpu", "hub"]
wgpu = ["dspk-cli/wgpu", "dspk-sorter-kilosort/wgpu", "dspk-sorter-ms5/wgpu", "dspk-sorter-si/wgpu"]
cpu = ["dspk-cli/cpu", "dspk-sorter-kilosort/cpu", "dspk-sorter-ms5/cpu", "dspk-sorter-si/cpu"]
cuda = ["dspk-cli/cuda", "dspk-sorter-kilosort/cuda", "dspk-sorter-ms5/cuda", "dspk-sorter-si/cuda"]
hip = ["dspk-cli/hip", "dspk-sorter-kilosort/hip", "dspk-sorter-ms5/hip", "dspk-sorter-si/hip"]
# Kilosort4's predefined universal templates, downloaded through dspk-hub (network access)
hub = ["dspk-sorter-kilosort/hub"]

[dependencies]
dspk-cli = { path = "../../../app/dspk-cli", default-features = false }
dspk-core = { workspace = true, features = ["compute"] }
dspk-synapse.workspace = true
# Every sorter of each family
dspk-sorter-kilosort = { workspace = true, default-features = false, features = ["ks4", "emusort"] }
dspk-sorter-ms5 = { workspace = true, default-features = false }
dspk-sorter-si = { workspace = true, default-features = false, features = ["sc2", "tdc2"] }
cubecl.workspace = true
clap.workspace = true
anstream.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
