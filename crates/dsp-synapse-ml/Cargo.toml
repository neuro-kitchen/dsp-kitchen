[package]
name = "dsp-synapse-ml"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Neuro spike sorters reimplemented from their papers (Kilosort4, EMUsort) and pretrained models, each with its provenance"

[features]
default = ["wgpu", "flex"]
wgpu = ["burn-tensor/wgpu", "cubecl/wgpu", "dsp-base/wgpu"]
flex = ["burn-tensor/flex"]
# Resolve catalog ids to verified local files (network access through dsp-synapse-hub)
hub = ["dep:dsp-synapse-hub", "dep:anyhow"]
cpu = ["cubecl/cpu", "dsp-base/cpu"]
cuda = ["cubecl/cuda", "dsp-base/cuda"]

[dependencies]
dsp-core = { workspace = true, features = ["compute"] }
dsp-base.workspace = true
dsp-synapse.workspace = true
dsp-io = { workspace = true, features = ["neuro"] }
burn-tensor.workspace = true
onnx-ir.workspace = true
safetensors.workspace = true
cubecl.workspace = true
bytemuck.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow = { workspace = true, optional = true }
dsp-synapse-hub = { workspace = true, optional = true }
tracing.workspace = true
