[package]
name = "dsp-synapse-ml"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Burn-powered deep learning model zoo for electrophysiology spike inference (synapseml)"

[features]
default = ["wgpu", "flex"]
wgpu = ["dep:burn-wgpu", "cubecl/wgpu", "dsp-base/wgpu"]
flex = ["dep:burn-flex"]
cpu = ["cubecl/cpu", "dsp-base/cpu"]
cuda = ["cubecl/cuda", "dsp-base/cuda"]

[dependencies]
dsp-core = { workspace = true, features = ["compute"] }
dsp-base.workspace = true
dsp-synapse.workspace = true
burn-tensor.workspace = true
burn-flex = { workspace = true, optional = true }
burn-wgpu = { workspace = true, optional = true }
onnx-ir.workspace = true
safetensors.workspace = true
memmap2.workspace = true
cubecl.workspace = true
bytemuck.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
sha2.workspace = true
hex.workspace = true
dirs.workspace = true
reqwest.workspace = true
