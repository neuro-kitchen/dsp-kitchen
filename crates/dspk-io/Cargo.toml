[package]
name = "dspk-io"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Recording file formats for dspk: raw binary and Zarr traces, format detection, chunk caching"

[features]
default = ["zarr"]
# Zarr recordings read from any store (a browser's files, memory): no file system needed
zarr-read = ["dep:zarrs"]
# Zarr folders on disk, read and written (chunks compressed and stored in parallel). In a
# browser page (no file system) the functions on folders compile and say so when called
zarr = ["zarr-read", "dep:rayon"]
# Live sources (`live`): recordings that grow while they are read, the ring buffer, the growing
# Zarr recording, the session log, the minimal sensor format (dspk-device; `dspk[device]`)
live = []
# Shared test assertions (`test_support`) for crates that implement more formats.
test-support = []

[dependencies]
dspk-core.workspace = true
memmap2.workspace = true
flate2.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tracing.workspace = true
zarrs = { workspace = true, optional = true }
# Zarr chunks compressed and stored in parallel
rayon = { workspace = true, optional = true }

# Folders on disk: everywhere but a browser page
[target.'cfg(not(target_family = "wasm"))'.dependencies]
zarrs = { workspace = true, optional = true, features = ["filesystem"] }
