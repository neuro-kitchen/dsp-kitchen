[package]
name = "dsp-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "dsp-cli"
path = "src/main.rs"

[features]
default = []
cpu = ["dsp-base/cpu", "dsp-synapse/cpu"]
cuda = ["dsp-base/cuda", "dsp-synapse/cuda"]
hip = ["dsp-base/hip", "dsp-synapse/hip"]

[dependencies]
dsp-core.workspace = true
dsp-base.workspace = true
dsp-synapse.workspace = true
dsp-stream.workspace = true
dsp-io.workspace = true
memmap2.workspace = true
clap.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
cubecl = { workspace = true, features = ["wgpu"] }
quinn.workspace = true
anyhow.workspace = true

