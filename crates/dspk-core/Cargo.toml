[package]
name = "dspk-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Core types for dspk: recordings, buffers, time, masks, windows, and the CubeCL compute layer with run-time device choice (wgpu, CUDA, HIP, CPU)"
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["wgpu", "cuda", "cpu"]
# The compute layer (CubeCL); off for crates that only need the core types (e.g. dspk-io).
compute = ["dep:cubecl"]
wgpu = ["compute", "cubecl/wgpu"]
cpu = ["compute", "cubecl/cpu"]
cuda = ["compute", "cubecl/cuda"]
hip = ["compute", "cubecl/hip"]

[dependencies]
cubecl = { workspace = true, optional = true }
num-traits.workspace = true
num-rational.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
