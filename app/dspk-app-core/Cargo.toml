[package]
name = "dspk-app-core"
description = "DSP App core: the workbench for any multichannel signal (open, view, process, write) and the plugin interface the domain plugins (electrophysiology: dspk-app-synapse) extend"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["electrophysiology", "neuroscience", "gui", "signal-processing", "spike-sorting"]
categories = ["science", "gui", "visualization"]

[features]
# Our builds compile wgpu, cuda and cpu in; hip compiles but is untested (no AMD GPU)
default = ["wgpu", "cuda", "cpu"]
wgpu = ["dspk-core/wgpu", "dspk-ops/wgpu", "dspk-pipeline/wgpu", "dspk-session/wgpu", "dep:wgpu"]
cpu = ["dspk-core/cpu", "dspk-ops/cpu", "dspk-pipeline/cpu", "dspk-session/cpu"]
cuda = ["dspk-core/cuda", "dspk-ops/cuda", "dspk-pipeline/cuda", "dspk-session/cuda"]
hip = ["dspk-core/hip", "dspk-ops/hip", "dspk-pipeline/hip", "dspk-session/hip"]

[dependencies]
web-time.workspace = true
dspk-core = { workspace = true, features = ["compute"] }
dspk-ops.workspace = true
# Generic formats (raw + .meta, Zarr); domain formats come from plugins
dspk-io.workspace = true
# Envelopes, pyramids and the signal backend; host only (the app draws on the CPU)
dspk-view = { workspace = true, default-features = false }
# Views' op chains are dspk-pipeline nodes; writing a view runs its pipeline
dspk-pipeline = { workspace = true, features = ["view"] }
# The session document, its commands and graph
dspk-session.workspace = true
# Servers (`dspk serve`): remote recordings (RemoteSignal), jobs, fetching results
dspk-stream.workspace = true
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
# settings.toml, keybindings.toml
toml_edit.workspace = true
# The session document (JSON) and its JSON Schema for agents
schemars.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
image.workspace = true
bytemuck.workspace = true
# GPUI (pinned in the workspace) and the shared UI of the neuro-kitchen apps
gpui-kit.workspace = true
kitchen-ui.workspace = true
# The shared frame: command registry, menus, search, status bar, Settings, jobs
kitchen-shell.workspace = true
sysinfo.workspace = true
# The wgpu adapters, named in the status bar and Settings › Compute (the same wgpu CubeCL runs on)
wgpu = { workspace = true, optional = true }
# Worker threads to the UI thread without a lock (`data::channel`)
futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# Files on disk, the network runtime: not in a browser
[target.'cfg(not(target_family = "wasm"))'.dependencies]
dspk-io = { workspace = true, features = ["zarr"] }
tokio.workspace = true

# A browser tab (`platform::web`): web workers when the build has threads; the page's address
# and storage (its server's name, the token kept between visits)
[target.'cfg(target_family = "wasm")'.dependencies]
wasm_thread = { version = "0.3.3", features = ["es_modules"] }
web-sys = { version = "0.3", features = ["Window", "Location", "Storage", "Document", "Element", "HtmlElement", "HtmlInputElement", "File", "FileList"] }
js-sys = "0.3"
wasm-bindgen = "0.2"

[dev-dependencies]
# Headless UI tests (`#[gpui_kit::test]`, `gpui_kit::test::TestWindowExt`)
gpui-kit = { workspace = true, features = ["test-support"] }
# Test fixtures only: real recordings (SpikeGLX) and spike detection
dspk-synapse.workspace = true
