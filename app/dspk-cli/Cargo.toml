[package]
name = "dspk-cli"
description = "Command line for dspk: pipelines, devices, recordings, detection, benchmarks, streaming, artifact hub; sorting through the separate dspk-sorters program"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "dspk"
path = "src/main.rs"

[features]
# Our builds compile wgpu, cuda and cpu in; hip compiles but is untested (no AMD GPU)
default = ["wgpu", "cuda", "cpu", "hub"]
# CubeCL runtimes (chosen at run time with --runtime among those compiled in)
wgpu = ["dspk-core/wgpu", "dspk-ops/wgpu", "dspk-pipeline/wgpu", "dspk-synapse/wgpu"]
cpu = ["dspk-core/cpu", "dspk-ops/cpu", "dspk-pipeline/cpu", "dspk-synapse/cpu"]
cuda = ["dspk-core/cuda", "dspk-ops/cuda", "dspk-pipeline/cuda", "dspk-synapse/cuda"]
hip = ["dspk-core/hip", "dspk-ops/hip", "dspk-pipeline/hip", "dspk-synapse/hip"]
# `hub` command: the artifact catalog, verified downloads (network access)
hub = []

[dependencies]
dspk-core = { workspace = true, features = ["compute"] }
dspk-ops.workspace = true
dspk-io = { workspace = true, features = ["zarr"] }
dspk-synapse.workspace = true
# Never the sorter crates: Kilosort4 / EMUsort are GPL-3.0; `sort` runs the separate dspk-sorters
# program instead (installed by `sorters_program`, downloads through dspk-hub)
dspk-hub = { workspace = true, features = ["synapse"] }
# Where `sorters_program` installs dspk-sorters (the user data folder)
dirs.workspace = true
dspk-pipeline.workspace = true
dspk-stream.workspace = true
dspk-view = { workspace = true, default-features = false }
cubecl.workspace = true
clap.workspace = true
anstream.workspace = true
anstyle.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
