[package]
name = "dspk-cli"
description = "Command line for dsp-kitchen: devices, recordings, detection, sorting, benchmarks, streaming, model hub"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "dspk"
path = "src/main.rs"

[features]
default = ["wgpu", "hub"]
# CubeCL runtimes (chosen at run time with --runtime among those compiled in)
wgpu = ["dspk-core/wgpu", "dspk-ops/wgpu", "dspk-synapse-ml/wgpu"]
cpu = ["dspk-core/cpu", "dspk-ops/cpu", "dspk-synapse/cpu", "dspk-synapse-ml/cpu"]
cuda = ["dspk-core/cuda", "dspk-ops/cuda", "dspk-synapse/cuda", "dspk-synapse-ml/cuda"]
hip = ["dspk-core/hip", "dspk-ops/hip", "dspk-synapse/hip"]
# `hub` command: verified downloads of published artifacts (network access)
hub = ["dspk-synapse-ml/hub", "dep:dspk-synapse-hub"]

[dependencies]
dspk-core = { workspace = true, features = ["compute"] }
dspk-ops.workspace = true
dspk-io = { workspace = true, features = ["neuro"] }
dspk-synapse.workspace = true
dspk-synapse-ml = { workspace = true, default-features = false }
dspk-synapse-hub = { workspace = true, optional = true }
dspk-stream.workspace = true
dspk-view = { workspace = true, default-features = false }
cubecl.workspace = true
clap.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
