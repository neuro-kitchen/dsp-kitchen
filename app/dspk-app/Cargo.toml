[package]
name = "dspk-app"
description = "DSP App: the workbench (dspk-app-core) with its plugins: electrophysiology (dspk-app-synapse)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["electrophysiology", "neuroscience", "gui", "signal-processing", "spike-sorting"]
categories = ["science", "gui", "visualization"]

[[bin]]
name = "dspk-app"
path = "src/main.rs"

[features]
# Our builds compile wgpu, cuda and cpu in; hip compiles but is untested (no AMD GPU)
default = ["wgpu", "cuda", "cpu", "synapse"]
wgpu = ["dspk-app-core/wgpu", "dspk-app-synapse?/wgpu"]
cpu = ["dspk-app-core/cpu", "dspk-app-synapse?/cpu"]
cuda = ["dspk-app-core/cuda", "dspk-app-synapse?/cuda"]
hip = ["dspk-app-core/hip", "dspk-app-synapse?/hip"]
# Electrophysiology: probes and shanks, SpikeGLX / NWB, sortings, the Sorting workspace
synapse = ["dep:dspk-app-synapse"]

[dependencies]
dspk-app-core.workspace = true
dspk-app-synapse = { workspace = true, optional = true }
clap.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
image.workspace = true
gpui-kit = "=0.9.0"
