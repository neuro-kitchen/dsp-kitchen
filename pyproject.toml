[project]
name = "dspk-dev"
version = "0.1.0"
description = "Development environment of the dspk repository (playground scripts, maturin); the Python package is bindings/python"
readme = "README.md"
authors = [{ name = "jesusdpa1" }]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "maturin>=1.16.0",
    "numpy>=2.5.4",
    "plating",
    "polars>=2.1.0",
]

[tool.uv]
# Not a package: `maturin develop` (bindings/python) installs dspk into this environment
package = false

[tool.uv.sources]
# How the playground's and benchmarks' figures are presented (repo-local, editable)
plating = { path = "plating", editable = true }

[tool.ruff]
src = ["bindings/python/python"]


[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "scipy>=1.18.1",
]
