# Python API reference of dsp-kitchen, generated from the stubs and docstrings
# (`dsp_kitchen_py/dsp_kitchen_bindings/dsp_kitchen_bindings.pyi`, written by
# `cargo run -p dsp_kitchen_py --bin stub_gen`). Read statically: the compiled module is not needed.
# Build the whole site (landing page, guide, Python and Rust references): `docs/build.sh`.
site_name: dsp-kitchen · Python API
docs_dir: docs
site_dir: site  # inside the project (Zensical requires it); docs/build.sh copies it into target/site/api/python
use_directory_urls: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/weather-sunny, name: Light mode }

extra:
  homepage: ../../

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [../../../dsp_kitchen_py]
          options:
            # The SDK re-exports the native module's classes: load its stub so they resolve
            preload_modules: [dsp_kitchen_bindings]
            docstring_style: numpy
            docstring_options:
              # Constructor parameters are documented in the class docstring (numpydoc's convention);
              # PyO3 classes construct through __new__, which griffe does not match them against
              warn_unknown_params: false
            docstring_section_style: table
            allow_inspection: false
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            merge_init_into_class: true
            members_order: source
            show_source: false
            show_if_no_docstring: true
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - toc: { permalink: true }
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Overview: index.md
  - Sorters:
      - Kilosort4: sorters/kilosort4.md
      - EMUsort: sorters/emusort.md
  - Recordings (io): io.md
  - Pipeline: pipeline.md
  - Filters:
      - IIR: filter/iir.md
      - FIR: filter/fir.md
      - Non-linear: filter/non_linear.md
      - Template subtraction: filter/template.md
  - Spatial: spatial.md
  - Math: math.md
  - Linear algebra: linalg.md
  - Spikes and units (synapse): synapse.md
  - Runtime and progress: runtime.md
