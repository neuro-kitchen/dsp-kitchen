[package]
name = "neuro-convert"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Read neurophysiology recordings (TDT, SpikeGLX, …) into one model and convert them to publication formats (NWB)"

# Standalone: not part of the dsp-kitchen workspace
[workspace]

[features]
default = ["tdt", "nwb"]
tdt = ["dep:zip"]
# NWB output (Zarr backend, pure Rust)
nwb = ["dep:zarrs", "dep:uuid"]

[dependencies]
memmap2 = "0.9.11"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"
thiserror = "2.0.21"
uuid = { version = "1.26.1", features = ["v4"], optional = true }
zarrs = { version = "0.23.14", default-features = false, features = ["filesystem", "gzip"], optional = true }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"], optional = true }
# Command-line tool
clap = { version = "4.6.7", features = ["derive"] }
anyhow = "1.0.104"

[[bin]]
name = "neuro-convert"
path = "src/bin/neuro-convert/main.rs"
