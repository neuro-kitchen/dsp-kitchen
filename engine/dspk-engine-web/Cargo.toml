[package]
name = "dspk-engine-web"
description = "The dspk engine in a browser worker: opens the files a page picked, builds their overview, runs a view's ops on the browser's WebGPU, answered with dspk serve's requests"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# Everything is for the browser (a single-thread module run in a dedicated worker); on other
# targets the crate is empty, so the workspace builds
[target.'cfg(target_family = "wasm")'.dependencies]
dspk-core = { workspace = true, features = ["wgpu"] }
dspk-ops = { workspace = true, features = ["wgpu"] }
dspk-pipeline = { workspace = true, features = ["wgpu", "view"] }
# Raw files and Zarr recordings read from the files picked (no file system in a browser)
dspk-io = { workspace = true, features = ["zarr-read"] }
zarrs.workspace = true
# NWB-Zarr recordings (the electrophysiology formats' reader, over the picked files)
dspk-synapse = { workspace = true, features = ["wgpu"] }
dspk-view.workspace = true
dspk-stream = { workspace = true, features = ["pipeline"] }
prost.workspace = true
serde_json.workspace = true
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["File", "Blob", "FileReaderSync"] }
