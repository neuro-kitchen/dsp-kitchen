[package]
name = "dspk-pipeline"
description = "dspk pipelines as data: a versioned node-graph spec (JSON, or TOML to write by hand) and an executor that streams a recording through dspk-ops stages on the device"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["wgpu", "cuda", "cpu"]
wgpu = ["dspk-core/wgpu", "dspk-ops/wgpu"]
cpu = ["dspk-core/cpu", "dspk-ops/cpu"]
cuda = ["dspk-core/cuda", "dspk-ops/cuda"]
hip = ["dspk-core/hip", "dspk-ops/hip"]
# A view's processed signal behind dspk-view's `SignalBackend` (the app, and `dspk serve` for
# clients that cannot compute)
view = ["dep:dspk-view", "dspk-view/device"]
# Pipelines on a live source (`live`): the live rule and the block runner (dspk-device)
live = ["dspk-io/live"]

[dependencies]
tracing.workspace = true
web-time.workspace = true
dspk-core = { workspace = true, features = ["compute", "schema"] }
dspk-io.workspace = true
# Raw output frames built in parallel
rayon.workspace = true
dspk-ops.workspace = true
dspk-view = { workspace = true, default-features = false, optional = true }
glob.workspace = true
cubecl.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
# Event tables (`format = "events"`) as Parquet, the table format of dspk's analytics

# Zarr stores are files on disk: not in a browser (`target_family = "wasm"`), where there is no
# file system
[target.'cfg(not(target_family = "wasm"))'.dependencies]
dspk-io = { workspace = true, features = ["zarr"] }
# Event tables as Parquet (Polars does not build for the browser)
dspk-table.workspace = true
