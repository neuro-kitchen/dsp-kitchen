[workspace]
resolver = "2"
members = [
    # DSP library
    "crates/dspk",
    "crates/dspk-core",
    "crates/dspk-io",
    "crates/dspk-ops",
    # Pipeline engine
    "engine/dspk-pipeline",
    # Electrophysiology
    "synapse/dspk-synapse-io",
    "synapse/dspk-synapse",
    "synapse/dspk-synapse-ml",
    "synapse/dspk-sort",
    "synapse/sorters/ms5",
    "synapse/dspk-synapse-hub",
    # Serving
    "serve/dspk-view",
    "serve/dspk-stream",
    # Front ends
    "app/dspk-cli",
    "app/dspk-app",
    # Bindings
    "bindings/python/dspk-py-core",
    "bindings/python/dspk-py",
]


[workspace.package]
version = "0.0.3"
edition = "2024"
authors = ["jesusdpa1 <17010046+jesusdpa1@users.noreply.github.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/neuro-kitchen/dsp-kitchen"
readme = "README.md"
keywords = ["dsp", "gpu", "signal-processing", "cubecl", "electrophysiology"]
categories = ["science", "algorithms", "concurrency"]

[workspace.dependencies]
dspk-core = { path = "crates/dspk-core", version = "0.0.3", default-features = false }
dspk-ops = { path = "crates/dspk-ops", version = "0.0.3", default-features = false }
dspk-synapse-io = { path = "synapse/dspk-synapse-io", version = "0.0.3", default-features = false }
dspk-synapse = { path = "synapse/dspk-synapse", version = "0.0.3", default-features = false }
dspk-synapse-ml = { path = "synapse/dspk-synapse-ml", version = "0.0.3", default-features = false }
dspk-sort = { path = "synapse/dspk-sort", version = "0.0.3", default-features = false }
dspk-ms5 = { path = "synapse/sorters/ms5", version = "0.0.3", default-features = false }
dspk-synapse-hub = { path = "synapse/dspk-synapse-hub", version = "0.0.3", default-features = false }
dspk-stream = { path = "serve/dspk-stream", version = "0.0.3", default-features = false }
dspk-view = { path = "serve/dspk-view", version = "0.0.3", default-features = false }
dspk-io = { path = "crates/dspk-io", version = "0.0.3", default-features = false }
dspk-pipeline = { path = "engine/dspk-pipeline", version = "0.0.3", default-features = false }
dspk-py-core = { path = "bindings/python/dspk-py-core", default-features = false }

# Compute & Tensors
# `persistence`: autotune decisions and compiled kernels survive the process (dspk-core
# `configure_runtime` keeps them in the user cache directory)
cubecl = { version = "0.11.3", default-features = false, features = ["std", "stdlib", "persistence"] }
# Kernel library on CubeCL (matmul); CubeCL itself has no matmul since 0.11
cubek-matmul = "0.3.1"
cubek-std = "0.3.1"
burn-tensor = "0.22.1"
onnx-ir = "0.22.0"
safetensors = "0.8.0"
bytemuck = { version = "1.25.2", features = ["derive"] }

# CLI & Configuration
clap = { version = "4.6.7", features = ["derive", "cargo", "env"] }
# CLI colours (clap's own; stripped when not a terminal or with NO_COLOR)
anstream = "1.0.0"
anstyle = "1.0.14"

# IPC & Transport
shared_memory = "0.12.4"
memmap2 = "0.9.12"
flate2 = "1.1.10"
zarrs = { version = "0.23.14", default-features = false, features = ["filesystem", "blosc", "crc32c", "gzip", "sharding", "zstd"] }
quinn = "0.11.12"
tonic = "0.14.8"
prost = "0.14.4"
prost-build = "0.14.4"
protox = "0.10.0"
rcgen = "0.14.10"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
rustls-pki-types = "1.15.1"

# UI & Graphics
slint = "1.18.1"
slint-build = "1.18.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
rfd = "0.17.2"

# Python Interop
pyo3 = { version = "0.29.3" }
numpy = "0.29.0"
# `.pyi` stubs of the Python extension (requires pyo3 < 0.30)
pyo3-stub-gen = "0.23.1"

# Concurrency & Async
rayon = "1.12.0"
tokio = { version = "1.54.1", features = ["full"] }

# Serialization & Utilities
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Pipeline specs: TOML input, JSON Schema of the spec types
toml = "1.1.8"
# Pipeline specs: input globs
glob = "0.3.4"
schemars = "1.2.3"
thiserror = "2.0.21"
anyhow = "1.0.104"
num-traits = "0.2.19"
num-complex = "0.4.6"
num-rational = { version = "0.4.2", features = ["serde"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
sha2 = "0.11.1"
hex = "0.4.3"
dirs = "7.0.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "blocking", "json"] }

# The one development build (Author, 2026-10-28: one compilation, not one per profile and feature
# set): tests, benchmarks, the CLI and the Python extension all use `--profile validate`, with the
# crates' default features (wgpu, cuda and cpu together). Our crates lightly optimized, incremental
# and with debug assertions and overflow checks (what tests need); dependencies (CubeCL, wgpu, …)
# fully optimized, without assertions, and cached. GPU kernels are compiled by CubeCL at run time,
# so device timings do not depend on this profile.
[profile.validate]
inherits = "release"
opt-level = 1
codegen-units = 256
incremental = true
debug-assertions = true
overflow-checks = true
debug = "line-tables-only"

[profile.validate.package."*"]
opt-level = 3
debug-assertions = false
overflow-checks = false

# Debug builds and tests: line tables only (panics and backtraces still name file and line), not
# full debug info, which filled `target/` (363 GB of debug builds, 2026-10-21). For a debugger
# session, `CARGO_PROFILE_DEV_DEBUG=full`.
[profile.dev]
debug = "line-tables-only"

# wgpu-core's lock tracing (debug assertions only) keeps a thread-local that is already gone when a
# CubeCL device runner shuts down, so the shutdown at exit (dspk-core `shutdown_devices`) aborted in
# debug builds. Only wgpu-core's internal checks are off; ours stay on.
[profile.dev.package.wgpu-core]
debug-assertions = false

# wgpu-types picks the instance flags: with debug assertions, `InstanceFlags::default()` turns on the
# Vulkan validation layer (CubeCL does not read `WGPU_VALIDATION`). The layer wraps device teardown
# and widened the exit race with NVIDIA's background shader compiler (SIGABRT in libnvidia-gpucomp
# during `vkDestroyDevice`, 2026-10-09). Debug builds now run like release ones; validation is
# opt-in through cubecl-wgpu's `vulkan-validate` feature.
[profile.dev.package.wgpu-types]
debug-assertions = false
