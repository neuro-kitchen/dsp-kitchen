[workspace]
resolver = "2"
members = [
    "crates/dsp-core",
    "crates/dsp-base",
    "crates/dsp-synapse",
    "crates/dsp-synapse-ml",
    "crates/dsp-synapse-hub",
    "crates/dsp-stream",
    "crates/dsp-view",
    "crates/dsp-io",
    "crates/dsp-cli",
    "crates/dsp-app",
    "dsp_kitchen_py",
]


[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["dsp-kitchen contributors"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
dsp-core = { path = "crates/dsp-core" }
dsp-base = { path = "crates/dsp-base" }
dsp-synapse = { path = "crates/dsp-synapse" }
dsp-synapse-ml = { path = "crates/dsp-synapse-ml" }
dsp-synapse-hub = { path = "crates/dsp-synapse-hub" }
dsp-stream = { path = "crates/dsp-stream" }
dsp-view = { path = "crates/dsp-view" }
dsp-io = { path = "crates/dsp-io" }
dsp_kitchen_py = { path = "dsp_kitchen_py" }

# Compute & Tensors
cubecl = { version = "0.11.0", default-features = false, features = ["std", "stdlib"] }
# Kernel library on CubeCL (matmul); CubeCL itself has no matmul since 0.11
cubek-matmul = "0.3.0"
cubek-std = "0.3.0"
burn-tensor = "0.22.0"
onnx-ir = "0.22.0"
safetensors = "0.8.0"
bytemuck = { version = "1.25.2", features = ["derive"] }

# CLI & Configuration
clap = { version = "4.6.7", features = ["derive", "cargo", "env"] }

# IPC & Transport
shared_memory = "0.12.4"
memmap2 = "0.9.11"
flate2 = "1.1.10"
zarrs = { version = "0.23.14", default-features = false, features = ["filesystem", "blosc", "crc32c", "gzip", "sharding", "zstd"] }
quinn = "0.11.12"
tonic = "0.14.6"
prost = "0.14.4"
prost-build = "0.14.4"
protox = "0.9.1"
rcgen = "0.14.10"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
rustls-pki-types = "1.15.1"

# UI & Graphics
slint = "1.18.1"
slint-build = "1.18.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
rfd = "0.17.2"

# Python Interop
pyo3 = { version = "0.29.3" }
numpy = "0.29.0"

# Concurrency & Async
rayon = "1.12.0"
tokio = { version = "1.53.1", features = ["full"] }

# Serialization & Utilities
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
anyhow = "1.0.104"
num-traits = "0.2.19"
num-complex = "0.4.6"
num-rational = { version = "0.4.2", features = ["serde"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
sha2 = "0.10.9"
hex = "0.4.3"
dirs = "6.0.0"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "blocking", "json"] }

# Lighter build for checking results from Python (`maturin develop --profile validate`): our crates
# lightly optimized and incremental (fast rebuilds after a change), dependencies (CubeCL, wgpu, …)
# fully optimized and cached. Timings for the benchmarks use `--release`.
[profile.validate]
inherits = "release"
opt-level = 1
codegen-units = 256
incremental = true

[profile.validate.package."*"]
opt-level = 3

# wgpu-core's lock tracing (debug assertions only) keeps a thread-local that is already gone when a
# CubeCL device runner shuts down, so the shutdown at exit (dsp-core `shutdown_devices`) aborted in
# debug builds. Only wgpu-core's internal checks are off; ours stay on.
[profile.dev.package.wgpu-core]
debug-assertions = false

# wgpu-types picks the instance flags: with debug assertions, `InstanceFlags::default()` turns on the
# Vulkan validation layer (CubeCL does not read `WGPU_VALIDATION`). The layer wraps device teardown
# and widened the exit race with NVIDIA's background shader compiler (SIGABRT in libnvidia-gpucomp
# during `vkDestroyDevice`, 2026-10-09). Debug builds now run like release ones; validation is
# opt-in through cubecl-wgpu's `vulkan-validate` feature.
[profile.dev.package.wgpu-types]
debug-assertions = false
