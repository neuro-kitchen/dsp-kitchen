[workspace]
resolver = "2"
# Standalone projects with their own workspace
exclude = ["neuro-convert"]
members = [
    "crates/dsp-core",
    "crates/dsp-base",
    "crates/dsp-synapse",
    "crates/dsp-synapse-ml",
    "crates/dsp-stream",
    "crates/dsp-io",
    "crates/dsp-cli",
    "crates/croc-app",
    "dsp_kitchen_py",
]


[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["dsp-kitchen contributors"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
dsp-core = { path = "crates/dsp-core" }
dsp-base = { path = "crates/dsp-base" }
dsp-synapse = { path = "crates/dsp-synapse" }
dsp-synapse-ml = { path = "crates/dsp-synapse-ml" }
dsp-stream = { path = "crates/dsp-stream" }
dsp-io = { path = "crates/dsp-io" }
dsp_kitchen_py = { path = "dsp_kitchen_py" }

# Compute & Tensors
cubecl = { version = "0.10.0", default-features = false }
burn-tensor = "0.21.0"
burn-flex = "0.21.0"
burn-wgpu = "0.21.0"
onnx-ir = "0.21.0"
safetensors = "0.8.0"
bytemuck = { version = "1.25.2", features = ["derive"] }

# CLI & Configuration
clap = { version = "4.6.7", features = ["derive", "cargo", "env"] }

# IPC & Transport
shared_memory = "0.12.4"
memmap2 = "0.9.11"
flate2 = "1.1.10"
zarrs = { version = "0.23.14", default-features = false, features = ["filesystem", "blosc", "crc32c", "gzip", "sharding", "zstd"] }
quinn = "0.11.12"
tonic = "0.14.6"
prost = "0.14.4"
rcgen = "0.14.10"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
rustls-pki-types = "1.15.1"

# UI & Graphics
slint = "1.18.1"
slint-build = "1.18.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
rfd = "0.17.2"

# Python Interop
pyo3 = { version = "0.29.3" }
numpy = "0.29.0"

# Concurrency & Async
tokio = { version = "1.53.1", features = ["full"] }

# Serialization & Utilities
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
anyhow = "1.0.104"
num-traits = "0.2.19"
num-complex = "0.4.6"
num-rational = { version = "0.4.2", features = ["serde"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
