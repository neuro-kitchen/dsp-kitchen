[project]
name = "plating"
version = "0.1.0"
description = "How dsp-kitchen's figures are presented: one theme, a few ready figures, synthetic signals and the benchmark JSON (used by playground/ and benchmarks/)"
requires-python = ">=3.10"
dependencies = ["matplotlib>=3.10", "numpy>=2.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["plating"]
