[package]
name = "dspk-synapse-ml"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
# Not published yet: the synapse names may change; app and CLI are not libraries
publish = false
description = "Neuro spike sorters reimplemented from their papers (Kilosort4, EMUsort) and pretrained models, each with its provenance"

[features]
default = ["wgpu", "cuda", "cpu", "flex"]
wgpu = ["burn-tensor/wgpu", "cubecl/wgpu", "dspk-ops/wgpu", "dspk-synapse/wgpu", "dspk-sort/wgpu", "dspk-ms5/wgpu"]
flex = ["burn-tensor/flex"]
# Resolve catalog ids to verified local files (network access through dspk-synapse-hub)
hub = ["dep:dspk-synapse-hub", "dep:anyhow"]
cpu = ["cubecl/cpu", "dspk-ops/cpu", "dspk-synapse/cpu", "dspk-sort/cpu", "dspk-ms5/cpu"]
cuda = ["cubecl/cuda", "dspk-ops/cuda", "dspk-synapse/cuda", "dspk-sort/cuda", "dspk-ms5/cuda"]
hip = ["cubecl/hip", "dspk-ops/hip", "dspk-synapse/hip", "dspk-sort/hip", "dspk-ms5/hip"]

[dependencies]
dspk-core = { workspace = true, features = ["compute"] }
dspk-ops.workspace = true
dspk-synapse.workspace = true
dspk-sort.workspace = true
dspk-ms5.workspace = true
dspk-io = { workspace = true, features = ["zarr"] }
dspk-synapse-io = { workspace = true, features = ["zarr"] }
burn-tensor.workspace = true
onnx-ir.workspace = true
safetensors.workspace = true
cubecl.workspace = true
bytemuck.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow = { workspace = true, optional = true }
dspk-synapse-hub = { workspace = true, optional = true }
rayon.workspace = true
tracing.workspace = true
