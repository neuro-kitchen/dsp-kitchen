[package]
name = "dspk-synapse-ml"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Pretrained neuro models (DARTsort, SpikeNet2, UnitRefine) and their runtime for dspk, each with its provenance"

[features]
default = ["wgpu", "cuda", "cpu", "flex"]
wgpu = ["burn-tensor/wgpu", "cubecl/wgpu", "dspk-ops/wgpu", "dspk-synapse/wgpu"]
flex = ["burn-tensor/flex"]
# Model files by catalog id, verified (network access through dspk-hub)
hub = ["dep:dspk-hub", "dspk-hub/synapse"]
cpu = ["cubecl/cpu", "dspk-ops/cpu", "dspk-synapse/cpu"]
cuda = ["cubecl/cuda", "dspk-ops/cuda", "dspk-synapse/cuda"]
hip = ["cubecl/hip", "dspk-ops/hip", "dspk-synapse/hip"]

[dependencies]
dspk-core = { workspace = true, features = ["compute"] }
dspk-ops.workspace = true
dspk-synapse.workspace = true
dspk-io = { workspace = true, features = ["zarr"] }
burn-tensor.workspace = true
onnx-ir.workspace = true
safetensors.workspace = true
cubecl.workspace = true
bytemuck.workspace = true
serde.workspace = true
serde_json.workspace = true
dspk-hub = { workspace = true, optional = true }
rayon.workspace = true
tracing.workspace = true
