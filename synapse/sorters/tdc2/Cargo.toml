[package]
name = "dspk-tdc2"
version.workspace = true
edition.workspace = true
authors.workspace = true
# Ported from SpikeInterface (MIT); MIT-compatible, so the workspace's MIT OR Apache-2.0
license.workspace = true
# Not published yet: published together with the other sorter crates
publish = false
description = "Tridesclous 2 spike sorter (SpikeInterface's internal sorter), ported to GPU kernels (CubeCL)"

[features]
default = ["wgpu", "cuda", "cpu"]
wgpu = ["dspk-core/wgpu", "dspk-ops/wgpu", "dspk-synapse/wgpu", "dspk-ms5/wgpu"]
cpu = ["dspk-core/cpu", "dspk-ops/cpu", "dspk-synapse/cpu", "dspk-ms5/cpu"]
cuda = ["dspk-core/cuda", "dspk-ops/cuda", "dspk-synapse/cuda", "dspk-ms5/cuda"]
hip = ["dspk-core/hip", "dspk-ops/hip", "dspk-synapse/hip", "dspk-ms5/hip"]

[dependencies]
dspk-core = { workspace = true, features = ["compute"] }
dspk-ops.workspace = true
dspk-synapse.workspace = true
dspk-synapse-io.workspace = true
dspk-ms5.workspace = true
cubecl.workspace = true
rayon.workspace = true
