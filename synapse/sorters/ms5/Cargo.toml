[package]
name = "dspk-sorter-ms5"
version.workspace = true
edition.workspace = true
authors.workspace = true
# A port of MountainSort 5 (Apache-2.0): the port stays under the same licence
license = "Apache-2.0"
repository.workspace = true
description = "MountainSort 5 spike sorter for dspk, ported from flatironinstitute/mountainsort5 (with isosplit6) to GPU kernels (CubeCL)"
keywords = ["spike-sorting", "mountainsort", "electrophysiology", "gpu", "dspk"]
categories = ["science"]

[features]
default = ["wgpu", "cuda", "cpu"]
wgpu = ["dspk-core/wgpu", "dspk-ops/wgpu", "dspk-synapse/wgpu"]
cpu = ["dspk-core/cpu", "dspk-ops/cpu", "dspk-synapse/cpu"]
cuda = ["dspk-core/cuda", "dspk-ops/cuda", "dspk-synapse/cuda"]
hip = ["dspk-core/hip", "dspk-ops/hip", "dspk-synapse/hip"]

[dependencies]
dspk-core = { workspace = true, features = ["compute"] }
dspk-ops.workspace = true
dspk-synapse.workspace = true
cubecl.workspace = true
rayon.workspace = true
