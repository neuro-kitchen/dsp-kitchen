[package]
name = "dspk-synapse"
version.workspace = true
edition.workspace = true
authors.workspace = true
# Our code MIT OR Apache-2.0; the isosplit6 port (src/sorting/isosplit.rs) Apache-2.0: NOTICE.md
license = "(MIT OR Apache-2.0) AND Apache-2.0"
# Not published yet: the synapse names may change; app and CLI are not libraries
publish = false

[features]
default = ["wgpu", "cuda", "cpu"]
wgpu = ["dspk-ops/wgpu"]
cpu = ["dspk-ops/cpu"]
cuda = ["dspk-ops/cuda"]
hip = ["dspk-ops/hip"]

[dependencies]
dspk-core = { workspace = true, features = ["compute"] }
dspk-ops.workspace = true
dspk-io = { workspace = true, features = ["zarr"] }
dspk-synapse-io = { workspace = true, features = ["zarr"] }
cubecl.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
zarrs.workspace = true

