[package]
name = "dspk-synapse"
version.workspace = true
edition.workspace = true
authors.workspace = true
# Our code and the SpikeInterface ports (MIT, NOTICE.md): MIT OR Apache-2.0
license.workspace = true
repository.workspace = true
description = "Electrophysiology for dspk: recording and sorting formats, probes, spike detection, waveforms, features, clustering, localization, quality metrics, and the shared parts of the sorters"
keywords = ["electrophysiology", "spike-sorting", "neuroscience", "gpu", "dspk"]
categories = ["science"]

[features]
default = ["wgpu", "cuda", "cpu"]
wgpu = ["dspk-ops/wgpu"]
cpu = ["dspk-ops/cpu"]
cuda = ["dspk-ops/cuda"]
hip = ["dspk-ops/hip"]

[dependencies]
dspk-core = { workspace = true, features = ["compute"] }
dspk-ops.workspace = true
dspk-io = { workspace = true, features = ["zarr"] }
cubecl.workspace = true
flate2.workspace = true
memmap2.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
zarrs.workspace = true

[dev-dependencies]
dspk-io = { workspace = true, features = ["zarr", "test-support"] }
